name: CD — Deploy Staging (develop)

on:
  push:
    branches: [ develop ]

jobs:
  deploy-staging:
    name: Deploy para ambiente de Homologação
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      # ── Frontend ──────────────────────────────────────────────
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências frontend
        run: npm ci
        working-directory: frontend

      - name: Build frontend (staging)
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.STAGING_API_URL }}

      - name: Deploy frontend → Vercel (staging)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: frontend
          alias-domains: smartstock-staging.vercel.app

      # ── Backend ───────────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build backend JAR (staging)
        run: mvn -f backend/pom.xml package -DskipTests --no-transfer-progress

      - name: Deploy backend → Railway (staging)
        run: |
          echo "Deploy para Railway ambiente staging"
          echo "Artefato: backend/target/gestao-estoque-*.jar"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
