name: CI — Build, Test & Coverage

on:
  push:
    branches: [ main, develop, 'feature/**', 'hotfix/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-ci:
    name: Backend — Java 21 / Maven
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build e testes com cobertura (JaCoCo)
        run: mvn -f backend/pom.xml verify --no-transfer-progress

      - name: Upload relatório JaCoCo
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          retention-days: 7

      - name: Publicar cobertura no Job Summary
        run: |
          echo "## 📊 Cobertura Backend (JaCoCo)" >> $GITHUB_STEP_SUMMARY
          echo "Relatório disponível em: \`backend/target/site/jacoco/index.html\`" >> $GITHUB_STEP_SUMMARY

  frontend-ci:
    name: Frontend — Node 20 / Vitest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci
        working-directory: frontend

      - name: Executar testes com cobertura
        run: npm run test:coverage
        working-directory: frontend

      - name: Upload relatório de cobertura (Vitest)
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage-report
          path: frontend/coverage/
          retention-days: 7

      - name: Build de produção
        run: npm run build
        working-directory: frontend
