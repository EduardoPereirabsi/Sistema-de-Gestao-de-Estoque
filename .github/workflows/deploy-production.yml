name: CD — Deploy Production (main)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Motivo do deploy manual'
        required: false
        default: 'Deploy manual solicitado'

jobs:
  deploy-production:
    name: Deploy para ambiente de Produção
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      # ── Testes obrigatórios antes do deploy ───────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Testes backend (obrigatório para deploy)
        run: mvn -f backend/pom.xml verify --no-transfer-progress

      # ── Frontend ──────────────────────────────────────────────
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências frontend
        run: npm ci
        working-directory: frontend

      - name: Testes frontend (obrigatório para deploy)
        run: npm run test:coverage
        working-directory: frontend

      - name: Build frontend (production)
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.PROD_API_URL }}

      - name: Deploy frontend → Vercel (production)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: frontend

      # ── Backend ───────────────────────────────────────────────
      - name: Build backend JAR (production)
        run: mvn -f backend/pom.xml package -DskipTests --no-transfer-progress

      - name: Deploy backend → Railway (production)
        run: |
          echo "Deploy para Railway ambiente production"
          echo "Artefato: backend/target/gestao-estoque-*.jar"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PROD }}

      # ── Versionamento semântico automático ────────────────────
      - name: Criar tag de versão
        run: |
          VERSION=$(mvn -f backend/pom.xml help:evaluate -Dexpression=project.version -q -DforceStdout)
          git tag -a "v${VERSION}-$(date +%Y%m%d%H%M)" -m "Release $VERSION — ${{ github.event.inputs.reason || 'deploy automático via main' }}"
          git push origin --tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
